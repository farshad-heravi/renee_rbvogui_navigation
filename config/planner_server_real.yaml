/**:
  planner_server:
    ros__parameters:
      # Real-robot variant of planner_server.yaml. The rover runs in dual
      # Ackermann mode, so NavFn's holonomic paths (which ignore the robot's
      # heading and turning radius) forced the controller to turn in place
      # at the start, mid-path and at the goal. Hybrid-A* plans from the
      # current heading to the goal heading with a bounded turning radius,
      # and Reeds-Shepp lets it back up (3-point turns) instead of spinning.
      expected_planner_frequency: 0.2
      planner_plugins: ["GridBased"]
      costmap_update_timeout: 1.0
      GridBased:
        plugin: "nav2_smac_planner::SmacPlannerHybrid"
        downsample_costmap: false
        downsampling_factor: 1
        tolerance: 0.25
        allow_unknown: true
        max_iterations: 1000000
        max_on_approach_iterations: 1000
        max_planning_time: 2.0
        motion_model_for_search: "REEDS_SHEPP"
        angle_quantization_bins: 72
        analytic_expansion_ratio: 3.5
        analytic_expansion_max_length: 3.0
        analytic_expansion_max_cost: 200.0
        analytic_expansion_max_cost_override: false
        # Dual Ackermann: R = (wheel_base / 2) / tan(max_steer), wheel_base
        # 0.736 m. 0.8 m ~ 25 deg max steer. Main knob: lower it if paths
        # take wide detours / many reversals, raise it if the rover can't
        # follow the curves.
        minimum_turning_radius: 0.8
        reverse_penalty: 2.0         # prefer driving forward
        change_penalty: 0.5          # discourage forward/reverse flip-flops
        non_straight_penalty: 1.2
        cost_penalty: 2.0
        retrospective_penalty: 0.015
        lookup_table_size: 20.0
        cache_obstacle_heuristic: false
        allow_primitive_interpolation: false
        debug_visualizations: false
        smooth_path: true
        smoother:
          max_iterations: 1000
          w_smooth: 0.3
          w_data: 0.2
          tolerance: 1.0e-10
          do_refinement: true
          refinement_num: 2

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: robot_map
        robot_base_frame: robot_base_link
        footprint: "[[0.6,-0.35],[0.6,0.35],[-0.6,0.35],[-0.6,-0.35]]"
        footprint_padding: 0.01
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "inflation_layer"]
        static_layer:
          map_topic: /map
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          # Hybrid-A* collision-checks the full rectangular footprint, so
          # inflation only shapes path cost. 2.0 m pushed paths far from walls
          # and blocked narrow passages; 0.75 m / 3.0 hugged the walls; 1.2 m
          # and 0.9 m were still more than wanted. The radius only truncates
          # the cost curve (set by cost_scaling_factor), so 0.75 keeps the
          # same push away from walls up close and frees space beyond it.
          # 0.75 is the floor (see below); for less wall clearance lower
          # GridBased.cost_penalty instead.
          # Must stay >= the circumscribed radius incl. footprint_padding
          # (0.708 m), or Smac logs an error on every plan and loses its fast
          # collision-check path. Wider clearance: raise the radius or lower
          # cost_scaling_factor (slower cost falloff).
          cost_scaling_factor: 2.0
          inflation_radius: 0.75
        always_send_full_costmap: true
