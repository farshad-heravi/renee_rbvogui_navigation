/**:
  planner_server:
    ros__parameters:
      # Real-robot variant of planner_server.yaml. The base turns in place
      # (see controller_server_real.yaml), so a grid path that ignores
      # heading and turning radius is fine: RPP pivots toward it at the start
      # and at sharp corners. The earlier Hybrid-A* Reeds-Shepp setup, made
      # for car-like steering, planned 3-point turns with reverse segments
      # that RPP no longer follows (allow_reversing is off).
      expected_planner_frequency: 0.2
      planner_plugins: ["GridBased"]
      costmap_update_timeout: 1.0
      GridBased:
        plugin: "nav2_smac_planner::SmacPlanner2D"
        downsample_costmap: false
        downsampling_factor: 1
        tolerance: 0.25
        allow_unknown: true
        max_iterations: 1000000
        max_on_approach_iterations: 1000
        max_planning_time: 2.0
        # Weight of inflation cost vs. path length (Smac2D default 2.0; the
        # Hybrid-A* equivalent was cost_penalty). Raise it for more wall
        # clearance, lower it to hug walls.
        cost_travel_multiplier: 2.0
        use_final_approach_orientation: false
        smoother:
          max_iterations: 1000
          w_smooth: 0.3
          w_data: 0.2
          tolerance: 1.0e-10

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: robot_map
        robot_base_frame: robot_base_link
        # Measured rover: chassis 1.044 m long, +0.508/-0.532 in base_link
        # (chassis_link sits 12 mm back); the front 3D scanner under the
        # chassis adds ~5 cm at the front, and the corner lasers stick 5 cm
        # out of each side for 0.776 m total width. Robotnik's own ROS1
        # move_base footprint is [[0.55,±0.38],[-0.55,±0.38]]. Kept symmetric
        # (rear extended to -0.56, 3 cm past the chassis) so the footprint is
        # the same driving forward and in reverse.
        footprint: "[[0.56,-0.39],[0.56,0.39],[-0.56,0.39],[-0.56,-0.39]]"
        footprint_padding: 0.01
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "inflation_layer"]
        static_layer:
          map_topic: /map
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          # SmacPlanner2D treats cells within the inscribed radius (0.39 +
          # padding) as lethal and uses the rest of the curve as path cost,
          # so the radius sets how far paths are pushed off walls. 2.0 m
          # pushed paths far from walls and blocked narrow passages; 0.75 m /
          # 3.0 hugged the walls. For less wall clearance lower
          # GridBased.cost_travel_multiplier instead.
          # 0.70 is the circumscribed-radius floor (hypot(0.57, 0.40) =
          # 0.696 m) that Hybrid-A*'s footprint check needed; kept so path
          # costs match the previous tuning, but SmacPlanner2D can go lower.
          cost_scaling_factor: 2.0
          inflation_radius: 0.70
        always_send_full_costmap: true
